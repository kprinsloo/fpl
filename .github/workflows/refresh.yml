name: Weekly refresh

on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesdays 06:00 UTC, after Monday night games
  workflow_dispatch:
    inputs:
      manager_id:
        description: "FPL manager ID to start tracking (optional)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/data/**"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.text }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add manager
        if: github.event_name == 'workflow_dispatch' && inputs.manager_id != ''
        run: python scripts/fetch_managers.py --add "${{ inputs.manager_id }}"

      - name: Fetch player data
        run: python scripts/fetch_fpl.py | tee fetch.log

      - name: Fetch managers
        run: python scripts/fetch_managers.py

      - name: Predict next 3 gameweeks
        run: python scripts/predict.py

      - name: Summary
        id: summary
        run: echo "text=$(head -n1 fetch.log)" >> "$GITHUB_OUTPUT"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data docs/data managers.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Weekly data refresh"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  log:
    needs: [refresh, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SUMMARY: ${{ needs.refresh.outputs.summary }}
          REFRESH: ${{ needs.refresh.result }}
          DEPLOY: ${{ needs.deploy.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const ok = process.env.REFRESH === 'success' && process.env.DEPLOY === 'success';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const pages = `https://${owner}.github.io/${repo}/`;
            let issues = await github.rest.issues.listForRepo({owner, repo, labels: 'refresh-log', state: 'open', per_page: 1});
            let number = issues.data[0]?.number;
            if (!number) {
              try { await github.rest.issues.createLabel({owner, repo, name: 'refresh-log', color: '37003c'}); } catch (e) {}
              const created = await github.rest.issues.create({owner, repo, title: 'Weekly refresh log', labels: ['refresh-log'],
                body: 'The weekly refresh posts a comment here after each scheduled or manual run.'});
              number = created.data.number;
            }
            const body = ok
              ? `@${owner} ✅ Refresh done. ${process.env.SUMMARY || ''}\n\nDashboard: ${pages}\nRun: ${run}`
              : `@${owner} ⚠️ Refresh failed (data: ${process.env.REFRESH}, deploy: ${process.env.DEPLOY}).\n\nCheck the run: ${run}`;
            await github.rest.issues.createComment({owner, repo, issue_number: number, body});
